paths:
  root: "/root/autodl-tmp/UserAgent"
  env_file: "/root/autodl-tmp/UserAgent/agentic-harness-engineering/.env"
  genminds:
    "1989660417": "/root/autodl-tmp/UserAgent/outputs/weibo_kg_genminds_1989660417/memory_bank.json"
    "7463374646": "/root/autodl-tmp/UserAgent/outputs/weibo_kg_genminds_7463374646/memory_bank.json"
  persona:
    "1989660417": "/root/autodl-tmp/UserAgent/outputs/weibo_user_1989660417/persona.json"
    "7463374646": "/root/autodl-tmp/UserAgent/outputs/weibo_user_7463374646/persona.json"
  user_csv:
    "7463374646": "/root/autodl-tmp/UserAgent/7463374646.csv"
    "1989660417": "/root/autodl-tmp/UserAgent/1989660417.csv"
  theory_seed: "data/theory_seed.json"
  theory_library: "data/theory_library"
  user_state: "data/users"

# Local OpenAI-compatible endpoint (DeepSeek-V4-Flash via vLLM on 2×H800).
# Override with LLM_* env vars in .env if needed.
llm:
  model: "DeepSeek-V4-Flash"
  # Local Flash max_model_len=4096; keep headroom for prompt + CoT + JSON answer
  max_tokens: 1200
  temperature: 0.4
  # White-box CoT (RTWI): keep thinking stream for mining/reasoning audit
  enable_thinking: true
  reasoning_effort: "high"
  base_url: "http://127.0.0.1:8001/v1"
  api_key: "EMPTY"

retrieval:
  top_k_events: 6
  top_k_theories: 3
  max_motifs: 8

theory_crawl:
  per_query: 50
  pages: 2
  mailto: "research@useragent.local"
  domains_file: "data/theory_domains.yaml"
  seed_queries:
    - "risk perception misinformation communication"
    - "trust repair rumor correction"
    - "identity threat motivated reasoning"
    - "uncertainty reduction visual evidence persuasion"
    - "fairness justice public opinion"
    - "technology threat AI anxiety"
    - "elaboration likelihood model persuasion"
    - "inoculation theory misinformation"
    - "spiral of silence public opinion"
    - "cognitive dissonance attitude change"

loop:
  max_iterations: 3
  evolve_lr: 0.15
  max_supervisor_restarts: 20
  supervisor_backoff_s: 10

agent:
  # Local Flash (4096 ctx): fewer tool rounds + tighter context to leave room for CoT/answer
  max_tool_rounds: 4
  tool_result_max_chars: 600
  context_char_budget: 5500
  temperature: 0.3
  on_exhaust: finalize_forced
  tool_protocol: native
  skeptic_tool: false
  log_messages: false

path_agent:
  min_confidence: 0.35
  min_richness: 0.35
  repair_budget: 1
  skeptic_overturn_min_conf: 0.75
  query_reformulation: true
  skeptic_adaptive: true
  attribution_cache_threshold: 0.6
  adaptive_window: 50
  adaptive_alpha: 0.30

fast_path:
  enabled: false
  surprise_threshold: 0.80
  w_topic: 0.35
  w_lexical: 0.35
  w_prior: 0.30
  recent_window: 50

failure_memory:
  max_structures: 80
  max_repairs: 120
  admission_min_cause_freq: 2
  enabled: true
  weight_repairs_enabled: true
  revoke_on_fail: true
  revoke_min_feedback: 3
  revoke_max_score: 0.4

temporal_windows:
  enabled: false
  gap_hours: 1.0
  sample_ratio: 0.0
  sample_seed: 42
  large_window_min: 5

sampling:
  stratify_ratio: 0.0
  seed: 42

scoring:
  result_weights:
    stance: 0.25
    core_judgment: 0.25
    belief: 0.25
    value: 0.25
  reason_weight: 0.0
